<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#101311" />
    <link rel="icon" href="/assets/yrei-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <title>404 - Yrei</title>
    <style>
      :root {
        --ink: #101311;
        --paper: #f6f7f3;
        --acid: #c8ff4d;
        --coral: #ff6b53;
        --gutter: 56px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: Arial, "Noto Sans SC", sans-serif;
        line-height: 1.6;
        letter-spacing: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .error-header {
        display: flex;
        min-height: 74px;
        padding: 0 var(--gutter);
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #303632;
      }

      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .wordmark-symbol {
        display: block;
        width: 34px;
        height: 34px;
      }

      .error-header > span,
      .section-code {
        color: #7f8983;
        font-family: monospace;
        font-size: 0.68rem;
      }

      .error-main {
        position: relative;
        min-height: calc(100svh - 74px);
        padding: 82px var(--gutter);
        overflow: hidden;
      }

      .section-code {
        margin: 0;
      }

      .error-copy {
        position: relative;
        z-index: 2;
        display: grid;
        margin-top: 72px;
        padding: 52px 0;
        grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.55fr);
        gap: 72px;
        align-items: end;
        border-top: 1px solid #424944;
        border-bottom: 1px solid #424944;
      }

      .error-copy h1 {
        margin: 0;
        font-size: 7.4rem;
        font-weight: 620;
        line-height: 0.92;
      }

      .error-copy h1 span {
        color: var(--acid);
      }

      .error-copy p {
        margin: 0;
        color: #b5beb8;
        font-family: Georgia, serif;
        font-size: 1.2rem;
      }

      .error-copy p + p {
        margin-top: 8px;
        color: #7f8983;
        font-family: Arial, "Noto Sans SC", sans-serif;
        font-size: 0.78rem;
      }

      .error-copy a {
        display: flex;
        min-height: 48px;
        margin-top: 34px;
        padding: 0 14px;
        align-items: center;
        justify-content: space-between;
        border: 1px solid #59635d;
        font-size: 0.74rem;
        font-weight: 700;
      }

      .error-copy a:hover,
      .error-copy a:focus-visible {
        background: var(--acid);
        color: var(--ink);
      }

      .error-glyph {
        position: absolute;
        right: 28px;
        bottom: -62px;
        z-index: 1;
        color: #202722;
        font-family: Georgia, serif;
        font-size: 24rem;
        line-height: 1;
      }

      :focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 4px;
      }

      @media (max-width: 760px) {
        :root {
          --gutter: 20px;
        }

        .error-copy {
          margin-top: 48px;
          padding: 38px 0;
          grid-template-columns: 1fr;
          gap: 42px;
        }

        .error-copy h1 {
          font-size: 4.1rem;
        }

        .error-glyph {
          right: 4px;
          bottom: -18px;
          font-size: 12rem;
        }
      }
    </style>
  </head>
  <body class="error-page">
    <header class="error-header">
      <a class="wordmark" href="/" aria-label="Yrei home">
        <svg class="wordmark-symbol" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" fill="#c8ff4d" />
          <path d="M13 13 32 32 51 13M32 32v20" fill="none" stroke="#101311" stroke-width="6" />
          <path d="M8 32h8M48 32h8M32 8v8" fill="none" stroke="#ff6b53" stroke-width="3" />
          <rect x="28" y="28" width="8" height="8" fill="#101311" />
        </svg>
        <span class="wordmark-text">yrei.dev</span>
      </a>
      <span>ERR / 404</span>
    </header>

    <main class="error-main">
      <p class="section-code">LOST SIGNAL / 页面不存在</p>
      <div class="error-copy">
        <h1>Still here<span>.</span></h1>
        <div>
          <p>The address disappeared, but the identity did not.</p>
          <p lang="zh-CN">这个地址消失了，但 Yrei 还在这里。</p>
          <a href="/">Return home <span aria-hidden="true">&#8599;</span></a>
        </div>
      </div>
      <div class="error-glyph" aria-hidden="true">霊</div>
    </main>
  </body>
</html>
